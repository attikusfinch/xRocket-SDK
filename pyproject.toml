[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "xrocket-sdk"
version = "0.1.0.dev0"
description = "Typed Python clients for xRocket Pay; Exchange support planned"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.14,<1",
  "mypy>=1.18,<2",
  "build>=1,<2",
  "hatchling>=1.27,<2",
  "editables>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xrocket"]

[tool.hatch.build.targets.sdist]
exclude = ["/workflow/.autopilot/**"]
include = [
  "/src", "/tests", "/spec", "/README.md", "/pyproject.toml", "/requirements-dev.lock",
  "/AGENTS.md", "/START.md", "/workflow", "/tools/session.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra -m 'not live'"
markers = ["live: opt-in public/private read-only GET checks against the Pay testnet API"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
